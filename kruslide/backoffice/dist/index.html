<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KruSlide หลังบ้าน</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ctitle%3EKruSlide%3C/title%3E%3Crect width='120' height='120' rx='32' fill='%231C2A55'/%3E%3Crect x='26' y='24' width='18' height='72' rx='7' fill='%23fff'/%3E%3Cpath d='M50 60 L86 26' stroke='%233D7BFF' stroke-width='18' stroke-linecap='round'/%3E%3Cpath d='M52 52 L88 84 L68 82 L60 100 Z' fill='%23FFC83D'/%3E%3C/svg%3E">
<style>
@font-face{font-family:Inter;src:url(samples/_shared/fonts/Inter-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(samples/_shared/fonts/Inter-Medium.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(samples/_shared/fonts/Inter-SemiBold.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(samples/_shared/fonts/Inter-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Anuphan;src:url(samples/_shared/fonts/Anuphan-Thai-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0E00-0E7F}
@font-face{font-family:Anuphan;src:url(samples/_shared/fonts/Anuphan-Thai-600.woff2) format('woff2');font-weight:600;font-display:swap;unicode-range:U+0E00-0E7F}
@font-face{font-family:Anuphan;src:url(samples/_shared/fonts/Anuphan-Thai-700.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0E00-0E7F}
/* VOICE   a calm internal console: dense, quiet, every item one click from "open" and "add to order"
   IDEA    a production catalog with an order pad: codes like a printer's job sheet
   PICTURE the real slides themselves (shots and live viewer); the UI stays out of their way
   COLOUR  white panels on a cool grey ground, KruSlide navy ink, blue for actions, yellow only for "in the order"
   TYPE    Inter + Anuphan, 13-14px body, 22px section titles; codes in tabular figures
   LAYOUT  fixed sidebar, one section per view with sub-tabs, dense grids; phones get a top bar and chip nav */
:root{
  --navy:#1C2A55;--blue:#3D7BFF;--blue-d:#2F63D6;--sun:#FFC83D;--sun-l:#FFF5D6;
  --bg:#F5F6FA;--panel:#fff;--line:#E3E6EF;--line-2:#EEF0F5;--ink:#1C2A55;--ink-2:#46506E;--mute:#7A839C;
  --ok:#14936B;--ok-l:#E3F6EE;--warn:#B76E00;--warn-l:#FFF1D9;--tint:#EEF3FF;
  --r:10px;--sb:236px;--font:Inter,Anuphan,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-d)}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
kbd{font:600 11px/1 var(--font);padding:3px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:#fff;color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:16px 12px;background:#fff;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}
.brand svg{width:32px;height:32px;flex:none;border-radius:8px}
.brand b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.search-btn{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--mute);text-align:left}
.search-btn span{flex:1}
.search-btn:hover{border-color:#cdd3e2;color:var(--ink-2)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a[aria-current=page]{background:var(--tint);color:var(--navy);font-weight:600}
.nav a .n{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.nav a .n.pick{min-width:20px;padding:1px 6px;border-radius:10px;background:var(--sun);color:var(--navy);font-weight:700;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:8px;font-size:12px;color:var(--mute)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.lang button{border:0;background:#fff;padding:5px 12px;font-weight:600;font-size:12px;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.topbar,.chipnav{display:none}

main{padding:22px 28px 120px;max-width:1480px;width:100%}
.sec-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h1{font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.sec-head p{color:var(--mute);font-size:13px;margin-top:2px}
.sec-head .grow{flex:1}
.sec-head .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#c9d0e0;background:#FBFCFE}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn .ic{width:16px;height:16px}
.add{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;border:1px dashed #b9c3da;background:#fff;color:var(--ink-2);font-weight:600;font-size:12px;white-space:nowrap}
.add:hover{border-style:solid;border-color:var(--blue);color:var(--blue-d)}
.add[aria-pressed=true]{border:1px solid var(--sun);background:var(--sun-l);color:var(--navy)}
.add .ic{width:14px;height:14px}
.code{display:inline-block;font:700 11px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:.02em;padding:4px 6px;border-radius:5px;background:var(--navy);color:#fff;white-space:nowrap;vertical-align:1px}
.code.lite{background:var(--tint);color:var(--navy)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;background:var(--line-2);color:var(--ink-2);font-size:12px;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.pill.blue{background:var(--tint);color:var(--blue-d)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;height:36px;padding:0 12px;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy)}
.tabs button .n{font-weight:500;color:var(--mute);margin-left:4px;font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.field{position:relative;display:flex;align-items:center}
.field .ic{position:absolute;left:10px;color:var(--mute);pointer-events:none}
.input,.select,.textarea{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px;font-size:14px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,123,255,.15)}
.field .input{padding-left:32px;width:280px}
.textarea{height:auto;padding:8px 10px;resize:vertical;line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chips .lbl{font-size:12px;color:var(--mute);width:52px;flex:none}
.chips>*{flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:13px;white-space:nowrap}
.chip:hover{border-color:#c4cbdc}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.count{color:var(--mute);font-size:13px;margin-left:auto}
.empty{padding:40px 20px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r);background:#fff}

/* ---------- cards ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(208px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:#cfd5e4;box-shadow:0 4px 16px rgba(28,42,85,.07)}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--sun)}100%{box-shadow:0 0 0 0 transparent}}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;background:#E9ECF3;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:50% 0%}
.thumb.strip:hover img,.thumb.strip:focus-visible img{animation:cyc 3.6s step-end infinite}
@keyframes cyc{0%{object-position:50% 0%}33%{object-position:50% 50%}66%{object-position:50% 100%}}
.thumb .code{position:absolute;left:8px;top:8px}
.thumb .play{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;background:rgba(28,42,85,.86);color:#fff;font-size:12px;font-weight:600;opacity:0;transition:opacity .15s}
.thumb:hover .play,.thumb:focus-visible .play{opacity:1}
.thumb .play .ic{width:12px;height:12px;fill:currentColor;stroke:none}
.thumb.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;cursor:default}
.thumb.trio img{object-position:0 0}
.thumb .ph{display:grid;place-items:center;height:100%;color:var(--mute);font-size:12px}
.cbody{display:flex;flex-direction:column;gap:5px;padding:10px 12px 8px;flex:1}
.cbody h3 .code{margin-right:6px}
.cbody h3{font-size:14px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-bottom:1px}
.cbody .meta{font-size:12px;color:var(--mute);line-height:1.5}
.cbody .desc{font-size:13px;color:var(--ink-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-bottom:1px}
.styleline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);line-height:1.5}
.styleline span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;line-height:1.4;padding:2px 7px;border-radius:9px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.cfoot{display:flex;align-items:center;gap:6px;padding:8px 12px 10px;border-top:1px solid var(--line-2)}
.cfoot .sp{flex:1}
.links{display:flex;flex-wrap:wrap;gap:5px}
.lk{display:inline-flex;align-items:center;gap:5px;max-width:100%;height:26px;padding:0 8px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.lk:hover{border-color:var(--blue);color:var(--blue-d)}
.lk b{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.lk span{overflow:hidden;text-overflow:ellipsis}
.mcard .lk span:not(.sub),.stcard .lk span:not(.sub){max-width:150px}
.lk .ic{width:13px;height:13px}
.lk.more{border-style:dashed;color:var(--mute)}
.lk.soon{border-style:dashed;color:var(--mute);cursor:default}
.sub{font-size:12px;color:var(--mute)}

/* table view */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:13px}
.tbl th{position:sticky;top:0;background:#FAFBFD;text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#FAFBFE}
.tbl .tn{width:76px;padding:0;border-radius:5px;overflow:hidden;border:0;background:#E9ECF3;aspect-ratio:16/9;display:block}
.tbl .tn img{width:100%;height:100%;object-fit:cover;object-position:50% 0%}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);text-align:left;color:inherit;text-decoration:none}
.kpi:hover{border-color:#c9d0e0}
.kpi b{font-size:26px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--ink-2)}
.kpi small{font-size:12px;color:var(--mute)}
.kpi.hi{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hi span,.kpi.hi small{color:#C9D3F0}
.ov{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel>h2{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel>h2 .sub{font-weight:500}
.panel>h2 .btn{margin-left:auto}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row .tn{width:84px;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:0;padding:0;background:#E9ECF3}
.row .tn img{width:100%;height:100%;object-fit:cover;object-position:50% 0%}
.row .tx{flex:1;display:flex;flex-direction:column;gap:1px}
.row .tx b{font-weight:600;font-size:13px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{font-size:12px;color:var(--mute);line-height:1.45}
.status{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.status h3{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.st{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line-2);font-size:13px;line-height:1.5}
.st:first-of-type{border-top:0}
.st .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--ok)}
.st.doing .dot{background:var(--sun)}
.st .w{display:block;font-size:12px;color:var(--warn)}
.st .acts{margin-left:auto;display:flex;gap:4px;align-items:flex-start}
.auto{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--mute);line-height:1.6}
.keys{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:14px}
.keys span{display:inline-flex;gap:6px;align-items:center}

/* ---------- styles / mechanics ---------- */
.stcard .cbody h3{display:flex;align-items:baseline;gap:6px;-webkit-line-clamp:unset}
.stcard .cbody h3 .en{font-weight:500;color:var(--mute);font-size:12px}
.letter{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--sun);color:var(--navy);font:800 12px/1 var(--font)}
.mgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.mcard{display:flex;flex-direction:column;gap:7px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.mcard .hd{display:flex;align-items:flex-start;gap:8px}
.mcard .hd .tx{flex:1;display:flex;flex-direction:column}
.mcard .hd b{font-size:14px;font-weight:600;line-height:1.45}
.mcard .hd small{font-size:12px;color:var(--mute);line-height:1.4}
.mcard p{font-size:13px;color:var(--ink-2);line-height:1.55}
.grp{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px}
.grp:first-child{margin-top:0}
.grp h2{font-size:14px;font-weight:700}

/* ---------- products ---------- */
.prod{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px;align-items:start;margin-bottom:14px}
.prod.half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.prod .media{background:#0D1530;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.prod .media video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.prod .media .thumb{border-radius:0}
.info{display:flex;flex-direction:column;gap:10px}
.info h2{font-size:17px;line-height:1.4;font-weight:700;display:flex;gap:8px;align-items:baseline}
.info p{color:var(--ink-2);font-size:13px;line-height:1.6}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.plist{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.plist div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;font-size:13px;border-top:1px solid var(--line-2)}
.plist div:first-child{border-top:0}
.plist b{white-space:nowrap;font-variant-numeric:tabular-nums}
.acts-row{display:flex;flex-wrap:wrap;gap:6px}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.gal figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gal figure button{display:block;width:100%;padding:0;border:0;background:#EEF0F5;aspect-ratio:16/10;overflow:hidden}
.gal figure button img{width:100%;height:100%;object-fit:cover;object-position:50% 0%}
.gal figure.contain button img{object-fit:contain;padding:10px}
.gal figcaption{padding:7px 10px;font-size:12px;color:var(--ink-2);line-height:1.45}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}
.sw i{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
.sw b{font-variant-numeric:tabular-nums}
.font-spec{display:flex;gap:10px;flex-wrap:wrap}
.font-spec div{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.font-spec b{display:block;font-size:22px;line-height:1.3}

/* ---------- order ---------- */
.order{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:14px;align-items:start}
.form{display:flex;flex-direction:column;gap:12px}
.form .panel{display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:5px}
.fl>span{font-size:12px;font-weight:600;color:var(--ink-2)}
.fl .input,.fl .select{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.ck input{margin:0;accent-color:var(--blue)}
.ck:has(input:checked){border-color:var(--blue);background:var(--tint)}
.ck small{color:var(--mute)}
.picked{display:flex;flex-direction:column;gap:6px}
.pk-grp{font-size:12px;font-weight:600;color:var(--mute);margin-top:4px}
.pk{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.pk .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .x{border:0;background:none;width:26px;height:26px;border-radius:6px;color:var(--mute);display:grid;place-items:center}
.pk .x:hover{background:var(--line-2);color:var(--ink)}
.quick{display:flex;gap:6px}
.quick .input{flex:1}
.brief{width:100%;min-height:340px;font:13px/1.65 var(--font);white-space:pre-wrap;background:#FBFCFE}
.est{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:8px;background:var(--tint)}
.est b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.3}
.est small{font-size:12px;color:var(--ink-2);line-height:1.5}
.msg{font-size:12px;line-height:1.5;min-height:18px}
.msg.ok{color:var(--ok)}
.msg.no{color:var(--warn)}
.drafts .row .tx b{white-space:normal}

/* ---------- prices ---------- */
.prices{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.prices .qty{width:72px;height:30px;text-align:right;padding:0 8px}
.tot{position:sticky;top:16px;display:flex;flex-direction:column;gap:8px}
.tot .line{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.tot .line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tot .big b{font-size:20px}
.grp-row td{background:#FAFBFD;font-weight:700;font-size:12px;color:var(--ink-2)}

/* ---------- tray ---------- */
.tray{position:fixed;right:20px;bottom:20px;z-index:20;width:330px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(28,42,85,.16);overflow:hidden}
.tray[hidden]{display:none}
.tray-hd{display:flex;align-items:center;gap:8px;width:100%;height:46px;padding:0 12px;border:0;background:var(--navy);color:#fff;font-weight:600;text-align:left}
.tray-hd .n{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--sun);color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:700}
.tray-hd .sp{flex:1}
.tray-hd .chev{transition:transform .15s}
.tray.open .tray-hd .chev{transform:rotate(180deg)}
.tray-bd{display:none;max-height:min(50vh,360px);overflow:auto;padding:8px 10px;flex-direction:column;gap:6px}
.tray.open .tray-bd{display:flex}
.tray-ft{display:none;padding:8px 10px 10px;gap:6px;border-top:1px solid var(--line-2)}
.tray.open .tray-ft{display:flex}
.tray-ft .btn{flex:1}

/* ---------- viewer + palette ---------- */
dialog{padding:0;border:0;color:inherit}
.viewer{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;background:#0E1428;color:#fff}
.viewer[open]{display:flex;flex-direction:column}
.viewer::backdrop{background:rgba(10,14,30,.6)}
.vbar{display:flex;align-items:center;gap:12px;height:54px;padding:0 12px;flex:none;background:#151C36;border-bottom:1px solid #26304F}
.vclose{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:9px;border:0;background:#fff;color:var(--navy);font-weight:700;font-size:14px}
.vclose:hover{background:var(--sun)}
.vclose kbd{background:var(--line-2);border-color:#d0d5e2}
.vtitle{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap}
.vtitle b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.vtitle .code{background:var(--sun);color:var(--navy)}
.vhint{font-size:12px;color:#AEB8D6;display:flex;gap:6px;align-items:center;white-space:nowrap}
.vhint kbd{background:#222B4A;border-color:#38426A;color:#DDE3F5}
.vbar .add{background:transparent;color:#E4E9F8;border-color:#4A557B}
.vbar .add[aria-pressed=true]{background:var(--sun);color:var(--navy);border-color:var(--sun)}
.vbody{flex:1;position:relative;min-height:0}
.vbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.vbody .vimg{position:absolute;inset:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.vbody .vimg img{max-width:min(100%,1400px);height:auto;border-radius:6px;background:#fff}
.vbody .vimg.fit{align-items:center}
.vbody .vimg.fit img{max-height:100%;object-fit:contain}
.palette{width:min(640px,calc(100vw - 24px));margin:10vh auto auto;border-radius:12px;background:#fff;box-shadow:0 20px 50px rgba(10,14,30,.3);overflow:hidden}
.palette::backdrop{background:rgba(20,26,50,.35)}
.palette .pin{display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
.palette .pin input{flex:1;height:50px;border:0;outline:none;font-size:16px;background:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:min(56vh,440px);overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.palette li[aria-selected=true]{background:var(--tint)}
.palette li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette li .k{font-size:11px;color:var(--mute)}
.palette .pf{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ---------- narrow screens ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ov,.order,.prices{grid-template-columns:minmax(0,1fr)}
  .prod,.prod.half{grid-template-columns:minmax(0,1fr)}
  .tot{position:static}
}
@media (max-width:900px){
  .app{display:block}
  .side{display:none}
  .topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;flex:1}
  .topbar .brand svg{width:28px;height:28px}
  .topbar .icon-btn{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .chipnav{position:sticky;top:52px;z-index:14;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .chipnav::-webkit-scrollbar{display:none}
  .chipnav a{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink-2);text-decoration:none;font-size:13px;font-weight:500}
  .chipnav a[aria-current=page]{background:var(--navy);border-color:var(--navy);color:#fff}
  .chipnav a .n.pick{min-width:18px;padding:0 5px;border-radius:9px;background:var(--sun);color:var(--navy);font-size:11px;font-weight:700;text-align:center}
  main{padding:14px 12px 110px}
  .sec-head h1{font-size:19px}
  .field,.field .input{width:100%}
  .toolbar>.field{flex:1 1 100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .grid.wide,.mgrid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi:last-child{grid-column:1/-1}
  .status{grid-template-columns:minmax(0,1fr)}
  .two,.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tray{left:10px;right:10px;bottom:10px;width:auto}
  .toast{top:112px;bottom:auto}
  .two:has(.seg){grid-template-columns:minmax(0,1fr)}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vbar{height:auto;min-height:54px;flex-wrap:wrap;padding:7px 10px;gap:8px}
  .vhint{display:none}
  .vtitle{order:3;flex:1 1 100%;font-size:13px}
  .vbar .add{margin-left:auto}
  .keys{display:none}
  .tbl .hide-sm{display:none}
}
@media (max-width:520px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cbody{padding:8px 9px 6px}
  .cbody h3{font-size:13px}
  .cfoot{padding:6px 9px 8px;flex-wrap:wrap}
  .cfoot .add{flex:1;justify-content:center}
  .three{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- copy (clipboard only from a click; fallback to a selected textarea) ---------- */
function copyText(text, fallbackEl, msgEl) {
  const done = ok => {
    if (ok) { if (msgEl) { msgEl.className = 'msg ok'; msgEl.textContent = t('copied'); } toast(t('copied')); return; }
    let el = fallbackEl;
    if (!el) { showCopyBox(text); return; }
    el.focus(); el.select();
    let ok2 = false; try { ok2 = document.execCommand('copy'); } catch (e) { ok2 = false; }
    if (msgEl) { msgEl.className = 'msg ' + (ok2 ? 'ok' : 'no'); msgEl.textContent = ok2 ? t('copied') : t('copy_fail'); }
    if (ok2) toast(t('copied'));
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); return; }
  } catch (e) { /* fall through */ }
  done(false);
}
function showCopyBox(text) {
  let box = $('#copybox');
  if (!box) {
    box = document.createElement('div'); box.id = 'copybox'; box.className = 'tray open';
    box.style.cssText = 'left:50%;right:auto;transform:translateX(-50%);bottom:80px;z-index:70';
    document.body.appendChild(box);
  }
  box.hidden = false;
  box.innerHTML = `<div class="tray-hd"><span>${t('copybox')}</span><span class="sp"></span><button type="button" class="btn sm" data-act="copybox-x">${t('close')}</button></div><div class="tray-bd" style="display:flex"><textarea class="textarea" rows="2" readonly>${esc(text)}</textarea><p class="msg no">${t('copy_fail')}</p></div>`;
  const ta = $('textarea', box); ta.focus(); ta.select();
}

    ${groups.map(g => `<tr class="grp-row"><td colspan="5">${esc(L(g))}</td></tr>` + D.prices.items.filter(p => p.group === g.id).map(p => `<tr><td><b style="font-weight:600">${esc(L(p))}</b>${L(p, 'note') ? `<br><span class="sub">${esc(L(p, 'note'))}</span>` : ''}</td>
      <td class="num">${range(p.min, p.max)}</td><td class="hide-sm sub">${esc(L(p, 'per'))}</td>
      <td class="num"><label class="sr" for="pq-${p.id}">${esc(L(p))}</label><input class="input qty" id="pq-${p.id}" type="number" min="0" inputmode="numeric" data-in="pq" data-id="${p.id}" value="${ui.prices.qty[p.id] || ''}" placeholder="0"></td>
      <td class="num" id="ps-${p.id}">–</td></tr>`).join('')).join('')}
    </tbody></table><aside class="panel tot" id="p-tot"></aside></div>`;
  renderPriceTotals();
}

/* ---------- viewer ---------- */
const viewer = $('#viewer'); let opener = null;
function setViewerHead(title, code, sub, hint) {
  $('#vtitle').innerHTML = (code ? `<span class="code">${esc(code)}</span>` : '') + `<b>${esc(title)}</b>` + (sub ? `<span class="sub" style="color:#AEB8D6">· ${esc(sub)}</span>` : '');
  $('#vhint').innerHTML = hint;
  $('#vadd').innerHTML = code && BY.has(code) ? addBtn(code) : '';
}
function showViewer() { opener = opener || document.activeElement; if (!viewer.open) { try { viewer.showModal(); } catch (e) { viewer.setAttribute('open', ''); } } }
function openFrame(href, title, code, sub) {
  opener = document.activeElement;
  setViewerHead(title, code, sub, `<kbd>←</kbd><kbd>→</kbd> ${t('hint_slides')}`);
  const body = $('#vbody'); body.innerHTML = '';
  const f = document.createElement('iframe');
  f.title = title; f.setAttribute('allow', 'fullscreen; autoplay');
  f.addEventListener('load', () => {
    try {
      const w = f.contentWindow;
      w.addEventListener('keydown', e => { if (e.key === 'Escape' && !e.defaultPrevented && !w.document.documentElement.classList.contains('pen-on')) { e.preventDefault(); closeViewer(); } });
      if (viewer.open && document.activeElement !== f) f.focus();
      w.focus();
    } catch (e) { /* another origin: the close button still works */ }
  });
  f.src = href;
  body.appendChild(f);
  showViewer();
  f.focus();
}
function openImage(src, title, fit) {
  opener = document.activeElement;
  setViewerHead(title, '', '', `${t('hint_img')}`);
  $('#vbody').innerHTML = `<div class="vimg ${fit ? 'fit' : ''}" tabindex="0"><img src="${esc(src)}" alt="${esc(title)}"></div>`;
  showViewer();
  $('#vbody .vimg').focus();
}
function closeViewer() { if (viewer.open) viewer.close(); }
viewer.addEventListener('close', () => { $('#vbody').innerHTML = ''; const o = opener; opener = null; if (o && o.isConnected && o.focus) o.focus({ preventScroll: true }); });

/* ---------- palette ---------- */
const pal = $('#palette'), pq = $('#pq'), plist = $('#plist');
let pitems = [], psel = 0;
function entries() {
  const k = kind => ({ sample: t('k_sample'), style: t('k_style'), mech: t('k_mechanic'), prod: t('k_product') }[kind]);
  return [
    ...SECS.map((s, i) => ({ type: 'sec', id: s.id, name: L(s), k: `${t('section')} · ${i + 1}`, hay: (s.th + ' ' + s.en).toLowerCase() })),
    ...[...BY.entries()].map(([code, x]) => ({ type: 'item', code, kind: x.kind, name: L(x.o), k: k(x.kind) + (x.kind === 'sample' ? ` · ${x.o.level} · ${subj(x.o.subject)}` : ''),
      hay: [code, x.o.th, x.o.en, x.o.slug, x.o.level, x.o.style_th, x.o.style_en, x.o.letter && 'style ' + x.o.letter].filter(Boolean).join(' ').toLowerCase() })),
  ];
}
let ENTRIES = entries();
function paletteRender() {
  const q = pq.value.trim().toLowerCase(), nc = normCode(q);
  let list = ENTRIES;
  if (q) {
    const words = q.split(/\s+/);
    list = ENTRIES.map(e => {
      let sc = 0; const code = (e.code || '').toLowerCase();
      if (nc && e.code === nc) sc = 100; else if (code && code.startsWith(q)) sc = 60;
      else if (words.every(w => e.hay.includes(w))) sc = e.name.toLowerCase().startsWith(q) ? 40 : 20;
      return { e, sc };
    }).filter(x => x.sc).sort((a, b) => b.sc - a.sc).map(x => x.e);
  }
  pitems = list.slice(0, 60); psel = Math.min(psel, Math.max(0, pitems.length - 1));
  plist.innerHTML = pitems.map((e, i) => `<li role="option" data-i="${i}" aria-selected="${i === psel}">${e.code ? `<span class="code">${e.code}</span>` : icon(SECS.find(s => s.id === e.id).icon)}<span class="nm">${esc(e.name)}</span><span class="k">${esc(e.k)}</span>${e.code ? addBtn(e.code) : ''}</li>`).join('') || `<li class="sub">${t('no_match')}</li>`;
  const cur = $('[aria-selected="true"]', plist); if (cur) cur.scrollIntoView({ block: 'nearest' });
}
function openPalette() { ENTRIES = entries(); pq.placeholder = t('palette_ph'); pq.value = ''; psel = 0; $('#pfoot').innerHTML = `<span><kbd>↑</kbd><kbd>↓</kbd> ${t('p_move')}</span><span><kbd>Enter</kbd> ${t('p_enter')}</span><span><kbd>Shift</kbd>+<kbd>Enter</kbd> ${t('p_shift')}</span><span><kbd>Esc</kbd> ${t('close')}</span>`; paletteRender(); try { pal.showModal(); } catch (e) { pal.setAttribute('open', ''); } pq.focus(); }
function paletteGo(i, addOnly) {
  const e = pitems[i]; if (!e) return;
  if (addOnly) { if (e.code) { toggleItem(e.code); paletteRender(); } return; }
  pal.close();
  if (e.type === 'sec') { go(e.id); return; }
  const x = BY.get(e.code);
  if (x.kind === 'sample') { openFrame(x.o.href, L(x.o), x.o.code); return; }
  if (x.kind === 'prod' && x.o.open && D.extras[x.o.open]) { openFrame(D.extras[x.o.open].href, L(x.o), x.o.code); return; }
  focusCard(e.code);
}
pq.addEventListener('input', () => { psel = 0; paletteRender(); });
pq.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); psel = Math.max(0, Math.min(pitems.length - 1, psel + (e.key === 'ArrowDown' ? 1 : -1))); paletteRender(); }
  else if (e.key === 'Enter') { e.preventDefault(); paletteGo(psel, e.shiftKey); }
});
plist.addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (!li || e.target.closest('[data-act="add"]')) return; paletteGo(+li.dataset.i, false); });
pal.addEventListener('click', e => { if (e.target === pal) pal.close(); });

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'add') { e.stopPropagation(); toggleItem(d.code); if (order.items.includes(d.code) && currentSec() !== 'order') toast(t('added_x', d.code)); return; }
  if (a === 'rm') { toggleItem(d.code, false); return; }
  if (a === 'open') {
    const x = d.code && BY.get(d.code);
    const href = d.href || (x && x.kind === 'sample' && x.o.href); if (!href) return;
    openFrame(href, d.title || (x ? L(x.o) : ''), d.code || '', d.sub || ''); return;
  }
  if (a === 'img') { openImage(d.src, d.title || '', !!d.fit); return; }
  if (a === 'vclose') { closeViewer(); return; }
  if (a === 'card') { closeViewer(); focusCard(d.code); return; }
  if (a === 'palette') { openPalette(); return; }
  if (a === 'lang') { lang = d.v === 'en' ? 'en' : 'th'; store.set('lang', lang); rerender(); return; }
  if (a === 'tab') { ui[d.sec].tab = d.v; saveUi(); rerender(); return; }
  if (a === 'f') { const f = ui.samples; f[d.k] = (d.k !== 'view' && f[d.k] === d.v) ? '' : d.v; saveUi(); rerender(); return; }
  if (a === 'more') { const rest = JSON.parse(d.rest || '[]'); el.insertAdjacentHTML('beforebegin', rest.map(linkChip).join('')); el.remove(); return; }
  if (a === 'tray') { trayOpen = !trayOpen; renderTray(); const b = $('#tray .tray-hd'); if (b) b.focus(); return; }
  if (a === 'clear') { order.items = []; saveOrder(); syncAdds(); renderPicked(); renderOrderOut(); if (currentSec() === 'order') rerender(); return; }
  if (a === 'copytext') { copyText(d.text, null, null); return; }
  if (a === 'copybox-x') { const b = $('#copybox'); if (b) b.hidden = true; return; }
  if (a === 'oset') { order[d.k] = d.v === 'true' ? true : d.v === 'false' ? false : d.v; saveOrder(); if (d.k === 'type') rerender(); else { $$(`[data-act="oset"][data-k="${d.k}"]`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === d.v)); renderOrderOut(); } return; }
  if (a === 'copy-brief') { const ta = $('#brief'); copyText(ta.value, ta, $('#o-msg')); return; }
  if (a === 'save-draft') { saveDraft(false); return; }
  if (a === 'new-order') { if (order.items.length || order.book || order.notes) saveDraft(true); order = blankOrder(); saveOrder(); syncAdds(); rerender(); return; }
  if (a === 'load-draft') { const dr = drafts.find(x => x.id === d.id); if (dr) { order = Object.assign(blankOrder(), JSON.parse(JSON.stringify(dr))); order.items = order.items.filter(c => BY.has(c)); saveOrder(); syncAdds(); rerender(); } return; }
  if (a === 'del-draft') { drafts = drafts.filter(x => x.id !== d.id); store.set('drafts', drafts); renderDrafts(); return; }
  if (a === 'p-reset') { ui.prices.qty = {}; saveUi(); rerender(); return; }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.in === 'q') { ui[d.sec].q = el.value; saveUi(); ({ samples: renderSampleResults, styles: renderStyleResults, mechanics: renderMechResults })[d.sec](); return; }
  if (d.in === 'pq') { ui.prices.qty[d.id] = Math.max(0, parseInt(el.value, 10) || 0); saveUi(); renderPriceTotals(); return; }
  if (d.o) { order[d.o] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? '' : Math.max(0, parseInt(el.value, 10) || 0)) : el.value; saveOrder(); renderOrderOut(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.in === 'sort') { ui.samples.sort = el.value; saveUi(); renderSampleResults(); }
  if (el.dataset.o && el.tagName === 'SELECT') { order[el.dataset.o] = el.value; saveOrder(); renderOrderOut(); }
});
document.addEventListener('submit', e => {
  const f = e.target; if (f.dataset.actForm !== 'quick') return;
  e.preventDefault();
  const inp = $('#o-quick'); const parts = inp.value.split(/[\s,;]+/).filter(Boolean);
  const added = [], bad = [];
  parts.forEach(p => { const c = normCode(p); if (c && BY.has(c)) { if (!order.items.includes(c)) order.items.push(c); added.push(c); } else bad.push(p); });
  saveOrder(); syncAdds(); renderPicked(); renderOrderOut();
  const m = $('#o-msg'); if (m) { m.className = 'msg ' + (bad.length ? 'no' : 'ok'); m.textContent = [added.length ? t('added_x', added.join(' ')) : '', bad.length ? t('unknown_x', bad.join(' ')) : ''].filter(Boolean).join(' · '); }
  inp.value = bad.join(' '); inp.focus();
});
document.addEventListener('keydown', e => {
  const tg = e.target, typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable);
  const modal = viewer.open || pal.open;
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (!viewer.open) (pal.open ? pal.close() : openPalette()); return; }
  if (typing || modal || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); openPalette(); return; }
  if (/^[1-7]$/.test(e.key)) { go(SECS[+e.key - 1].id); return; }
  if (e.key === 'Escape' && trayOpen) { trayOpen = false; renderTray(); }
});
addEventListener('hashchange', render);
addEventListener('storage', e => { if (e.key === 'ksbo:order') { order = Object.assign(blankOrder(), store.get('order', {})); syncAdds(); if (currentSec() === 'order') rerender(); } });

render();
}

</script>
</body>
