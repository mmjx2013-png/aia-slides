<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KruSlide หลังบ้าน</title>
<link rel="icon" href="{{ICON_URI}}">
<style>
/*FONTS*/
/*CSS*/

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M10 8.5v5l4.5-2.5z"/><path d="M8 21h8"/></symbol>
<symbol id="i-style" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.8-1.8 0-1.4-1.3-1.7-1.3-3 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></symbol>
<symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 10V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5V7a1.5 1.5 0 0 1 3 0v6.5c0 4.4-2.8 7.5-6.5 7.5-2.6 0-4.1-1.2-5.6-3.3L3.6 14.4a1.6 1.6 0 0 1 2.5-2l2.9 3V8.5a1.5 1.5 0 0 1 3 0"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></symbol>
<symbol id="i-order" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></symbol>
<symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
<symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
<symbol id="i-tri" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
<symbol id="i-logo" viewBox="0 0 120 120"><!--ICON--></symbol>
</svg>

<div class="app">
  <aside class="side" aria-label="เมนู">
    <div class="brand"><svg aria-hidden="true"><use href="#i-logo"/></svg><div><b>KruSlide</b><small data-t="backoffice">หลังบ้าน</small></div></div>
    <button class="search-btn" type="button" data-act="palette"><svg class="ic"><use href="#i-search"/></svg><span data-t="search_all">ค้นหารหัสหรือชื่อ</span><kbd>/</kbd></button>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="lang" role="group" aria-label="ภาษา / Language"><button type="button" data-act="lang" data-v="th">ไทย</button><button type="button" data-act="lang" data-v="en">EN</button></div>
      <div id="built"></div>
    </div>
  </aside>
  <div>
    <header class="topbar">
      <div class="brand"><svg aria-hidden="true"><use href="#i-logo"/></svg><div><b>KruSlide</b><small data-t="backoffice">หลังบ้าน</small></div></div>
      <div class="lang" role="group" aria-label="ภาษา / Language"><button type="button" data-act="lang" data-v="th">ไทย</button><button type="button" data-act="lang" data-v="en">EN</button></div>
      <button class="icon-btn" type="button" data-act="palette" aria-label="ค้นหา"><svg class="ic"><use href="#i-search"/></svg></button>
    </header>
    <nav class="chipnav" id="chipnav" aria-label="เมนู"></nav>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<section class="tray" id="tray" hidden aria-label="ใบสั่งงาน"></section>

<dialog class="viewer" id="viewer" aria-label="ดูตัวอย่าง">
  <div class="vbar">
    <button class="vclose" type="button" data-act="vclose"><svg class="ic"><use href="#i-x"/></svg><span data-t="close">ปิด</span> <kbd>Esc</kbd></button>
    <div class="vtitle" id="vtitle"></div>
    <div class="vhint" id="vhint"></div>
    <span id="vadd"></span>
  </div>
  <div class="vbody" id="vbody"></div>
</dialog>

<dialog class="palette" id="palette" aria-label="ค้นหา">
  <div class="pin"><svg class="ic"><use href="#i-search"/></svg><input id="pq" type="text" autocomplete="off" spellcheck="false" aria-label="ค้นหา"><kbd>Esc</kbd></div>
  <ul id="plist" role="listbox"></ul>
  <div class="pf" id="pfoot"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="bo-data" type="application/json">/*DATA*/</script>
<script>
/*JS*/
</script>
</body>
</html>
