# The clickable DEMO of the KruSlide platform (DEMO_MODE): free workers.dev, a passcode gate, persona login
# instead of LINE, sample data only. Production uses wrangler.toml and is not touched by this file.
#   node scripts/demo-build.mjs                      # deck files + src/demo/catalog.ts
#   node scripts/demo-deploy.mjs                     # create D1, migrate, secrets, deploy (needs a Cloudflare token)
# Secrets (never in this file): SESSION_SECRET, DEMO_PASSCODE (set by scripts/demo-deploy.mjs).
name = "kruslide-demo"
main = "src/index.ts"
compatibility_date = "2026-11-20"
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "production"
DEMO_MODE = "on"
APP_ORIGIN = ""
LINE_OA_ID = "@368lkkze"
PAYMENT_PROVIDER = "manual"
NEW_MEMBER_APPROVAL = "on"
LINE_BOT_PROMPT = ""

# The demo's deck files (sample decks, fonts, quiz images) live in Workers KV, uploaded by scripts/demo-deploy.mjs.
# No route serves KV directly: a file is only ever read by the access-checked routes. No R2 bucket is needed.
# (Static Assets were tried first, but their upload token cannot pass the session proxy.)
[[kv_namespaces]]
binding = "DEMO_FILES"
id = "dde16778582b468693aa4af12709afd0"   # PLACEHOLDER: scripts/demo-deploy.mjs fills in the real id

[[d1_databases]]
binding = "DB"
database_name = "kruslide-demo"
database_id = "9622a731-940f-4d44-a240-65cba544eeca"   # PLACEHOLDER: scripts/demo-deploy.mjs fills in the real id
migrations_dir = "migrations"

[observability]
enabled = true

[observability.logs]
invocation_logs = false
