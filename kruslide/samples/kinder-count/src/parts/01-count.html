<!-- 1 · Count the apples: tap each one, it bounces and the big number grows. b1 = the apples line up in a row with 1–7 under them. -->
<section class="slide" id="kc-count" data-steps="1" data-title="นับผลไม้">
 <svg class="art" id="k1-art" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
 <h1 class="kt big in" style="left:110px;top:40px">นับแอปเปิ้ล</h1>
 <p class="ks in" style="left:120px;top:200px;--d:150">แตะแอปเปิ้ลทีละลูก แล้วนับดัง ๆ</p>
 <svg class="art ia" id="k1-fruit" viewBox="0 0 1920 1080" role="group" aria-label="แอปเปิ้ลบนต้นไม้ แตะเพื่อนับ"></svg>
 <div class="ab k1-panel in" style="--d:250">
  <svg class="k1-numsvg" viewBox="0 0 520 380" aria-hidden="true"><text id="k1-num" x="260" y="300" text-anchor="middle" filter="url(#cr)">0</text></svg>

  <div class="k1-dots" id="k1-dots"></div>

 </div>
 <button class="kb in" id="k1-reset" type="button" style="left:1430px;top:880px;--d:400">นับใหม่</button>

 {{FOOT}}
 <aside class="notes">ให้เด็กออกมาแตะแอปเปิ้ลทีละลูก แอปเปิ้ลจะเด้งและตัวเลขใหญ่ขึ้นทีละหนึ่ง ทุกคนนับออกเสียงพร้อมกัน ครบ 7 ลูกจะมีดาวขึ้น กด → ให้แอปเปิ้ลลงมาเรียงแถวพร้อมเลข 1 ถึง 7 ใต้แต่ละลูก</aside>
</section>
