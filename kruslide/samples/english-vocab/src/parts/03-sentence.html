<!-- 3 · Sentence builder: drag the word tiles into the speech bubble in the right order, then Check. b1 = a second sentence (a question). -->

 <h2 class="ct in" style="left:120px;top:56px">Build the sentence!</h2>

  <svg class="v3-kid o0" viewBox="0 0 420 560" aria-label="A child in a yellow raincoat with a red umbrella in the rain" role="img"><use href="#kid-rain"/></svg>
