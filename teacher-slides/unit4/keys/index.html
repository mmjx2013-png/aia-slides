.chip{display:inline-block;font:700 22px Inter;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:10px;background:var(--lblue);color:var(--blue)}
.chip.coral{background:var(--lcoral);color:#B8321F} .chip.mint{background:var(--lmint);color:#0A6E5B} .chip.violet{background:var(--lviolet);color:var(--violet)} .chip.sun{background:var(--lsun);color:#A86F00}

.steps{list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:16px}
.steps>li{counter-increment:st;position:relative;min-height:82px;padding:18px 22px 18px 86px;border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(15,27,51,.06);font:500 30px/1.4 Inter}

.c.wide{grid-column:1/-1}
.on.b1 .ch.r1 .c.ok,.on.b2 .ch.r2 .c.ok,.on.b3 .ch.r3 .c.ok,.ch .c.ok.picked{border-color:var(--mint);background:var(--lmint)}
.on.b1 .ch.r1 .c.ok b,.on.b2 .ch.r2 .c.ok b,.on.b3 .ch.r3 .c.ok b,.ch .c.ok.picked b{background:var(--mint);color:#fff}
.on.b1 .ch.r1 .c:not(.ok),.on.b2 .ch.r2 .c:not(.ok),.on.b3 .ch.r3 .c:not(.ok){filter:grayscale(1) opacity(.55)}

.yn{display:inline-grid;place-items:center;min-width:92px;padding:8px 16px;border-radius:14px;font:800 26px Inter}
.yn.y{background:var(--lmint);color:var(--okc)}.yn.n{background:var(--lcoral);color:var(--noc)}

/* ---------- drawings ---------- */
.kid{display:block;width:86px;height:auto;--ink:#2B2B2B}

.k .t{margin-top:-4px;font:700 24px Inter;padding:6px 12px;border-radius:10px;background:#fff;box-shadow:0 6px 16px rgba(15,27,51,.12);color:var(--blue)}
.clock{width:180px}
.clock .bell,.clock .body{fill:var(--coral)} .clock .face{fill:#fff} .clock .leg{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.clock .tk{stroke:var(--ink);stroke-width:3} .clock .hh{stroke:var(--ink);stroke-width:6;stroke-linecap:round} .clock .mh{stroke:var(--blue);stroke-width:5;stroke-linecap:round} .clock .pin{fill:var(--ink)}
.clock .hh,.clock .mh{transform-origin:60px 72px;transform:rotate(var(--a))}
svg.chart{display:block;overflow:visible;font-family:Inter}

.f-blue{fill:var(--blue)}.f-violet{fill:var(--violet)}.f-coral{fill:var(--coral)}.f-mint{fill:var(--mint)}.f-sun{fill:var(--sun)}.f-ink{fill:var(--ink)}.f-mute{fill:#AAB4CC}
.s-blue{stroke:var(--blue)}.s-violet{stroke:var(--violet)}.s-coral{stroke:var(--coral)}.s-mint{stroke:var(--mint)}.s-sun{stroke:var(--sun)}.s-ink{stroke:var(--ink)}
.seg{fill:none;stroke-width:34}

.legend span::before{content:"";display:inline-block;width:18px;height:18px;border-radius:5px;margin-right:9px;vertical-align:-2px;background:var(--c)}
.prow{display:flex;align-items:center;height:96px;border-bottom:2px dashed var(--line)}
.prow .day{width:150px;font:700 30px Inter}
.icons{display:flex;gap:12px;align-items:flex-end}

.key .cup{width:36px;height:54px}

/* ---------- motion ----------
   .in            enters when the slide opens (delay: style="--d:300" ms)
   .g1 .g2 .g3 .g4  appear on beat 1..4 (slide data-steps="N"); also take --d
   .h1 .h2 .h3    visible until beat 1..3, then fade out
   inside a beat group, .grow (bars) .draw (paths, pathLength="1") .pop .drop .segd (donut) start when the group shows
   --n on children staggers them (pop/drop/grow use --n * 80ms) */
.in{opacity:0}
.on .in{animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0)*1ms)}
.g1,.g2,.g3,.g4{opacity:0}
.on.b1 .g1,.on.b2 .g2,.on.b3 .g3,.on.b4 .g4{animation:rise .7s var(--ease) both;animation-delay:calc(var(--d,0)*1ms)}
.on .h1,.on .h2,.on .h3{animation:rise .7s var(--ease) both;animation-delay:calc(var(--d,0)*1ms)}
.on.b1 .h1,.on.b2 .h2,.on.b3 .h3{animation:out .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-16px)}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-150px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{opacity:1;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes growx{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(calc(var(--a) - 720deg))}to{transform:rotate(var(--a))}}
@keyframes segd{from{stroke-dasharray:0 var(--C)}to{stroke-dasharray:var(--len) var(--C)}}
@keyframes floatin{from{opacity:0;transform:translateY(70px) rotate(var(--r,0deg)) scale(.94)}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes bob{from{opacity:1;transform:rotate(var(--r,0deg))}to{opacity:1;transform:translateY(-14px) rotate(var(--r,0deg))}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.grow{transform-box:fill-box;transform-origin:bottom}
.growx{transform-box:fill-box;transform-origin:left}
.pop,.drop{transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.segd{stroke-dasharray:0 var(--C)}
.grow,.growx,.pop,.drop{opacity:0}
.on .grow{animation:grow .9s var(--ease) both;animation-delay:calc(var(--d,600)*1ms + var(--n,0)*90ms)}
.on .growx{animation:growx .9s var(--ease) both;animation-delay:calc(var(--d,600)*1ms + var(--n,0)*90ms)}
.on .pop{animation:pop .45s var(--ease) both;animation-delay:calc(var(--d,500)*1ms + var(--n,0)*80ms)}
.on .drop{animation:drop .55s var(--ease) both;animation-delay:calc(var(--d,700)*1ms + var(--n,0)*55ms)}
.on .draw{animation:draw 1s ease both;animation-delay:calc(var(--d,500)*1ms + var(--n,0)*120ms)}
.on .segd{animation:segd .9s var(--ease) both;animation-delay:calc(var(--d,700)*1ms + var(--n,0)*200ms)}
.on .clock .hh,.on .clock .mh{animation:spin 1.8s cubic-bezier(.25,.6,.2,1) both .45s}
/* inside a beat group, wait for the beat */
.on .g1 :is(.grow,.growx,.pop,.drop,.draw,.segd),.on .g2 :is(.grow,.growx,.pop,.drop,.draw,.segd),.on .g3 :is(.grow,.growx,.pop,.drop,.draw,.segd),.on .g4 :is(.grow,.growx,.pop,.drop,.draw,.segd){animation:none}
.on.b1 .g1 .grow,.on.b2 .g2 .grow,.on.b3 .g3 .grow,.on.b4 .g4 .grow{animation:grow .9s var(--ease) both;animation-delay:calc(var(--d,300)*1ms + var(--n,0)*90ms)}
.on.b1 .g1 .growx,.on.b2 .g2 .growx,.on.b3 .g3 .growx,.on.b4 .g4 .growx{animation:growx .9s var(--ease) both;animation-delay:calc(var(--d,300)*1ms + var(--n,0)*90ms)}
.on.b1 .g1 .pop,.on.b2 .g2 .pop,.on.b3 .g3 .pop,.on.b4 .g4 .pop{animation:pop .45s var(--ease) both;animation-delay:calc(var(--d,250)*1ms + var(--n,0)*80ms)}
.on.b1 .g1 .drop,.on.b2 .g2 .drop,.on.b3 .g3 .drop,.on.b4 .g4 .drop{animation:drop .55s var(--ease) both;animation-delay:calc(var(--d,400)*1ms + var(--n,0)*55ms)}
.on.b1 .g1 .draw,.on.b2 .g2 .draw,.on.b3 .g3 .draw,.on.b4 .g4 .draw{animation:draw 1s ease both;animation-delay:calc(var(--d,300)*1ms + var(--n,0)*120ms)}
.on.b1 .g1 .segd,.on.b2 .g2 .segd,.on.b3 .g3 .segd,.on.b4 .g4 .segd{animation:segd .9s var(--ease) both;animation-delay:calc(var(--d,400)*1ms + var(--n,0)*200ms)}
.float{opacity:0;transform:rotate(var(--r,0deg))}
.on .float{animation:floatin 1s var(--ease) both,bob 7s ease-in-out infinite alternate;animation-delay:calc(var(--d,0)*1ms),calc(var(--d,0)*1ms + 1s)}
.rm *,.rm *::before,.rm *::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0s!important}

/* ---------- lesson opener ---------- */
.opener .num{font:800 300px/.8 Display;letter-spacing:-.06em;background:linear-gradient(160deg,var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.opener .goals{list-style:none;display:flex;flex-direction:column;gap:16px}
.opener .goals li{display:flex;gap:16px;align-items:center;font:500 30px Inter}
.opener .goals li svg{width:34px;height:34px;padding:5px;border-radius:10px;background:var(--lblue);color:var(--blue);flex:none}

/* ---------- control bar + menu (engine) ---------- */
#ctl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:flex;max-width:calc(100vw - 16px);box-sizing:border-box;gap:6px;align-items:center;padding:7px;border-radius:14px;background:rgba(15,27,51,.86);box-shadow:0 8px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;font:600 14px Inter}
#ctl.show,#ctl:hover,#ctl:focus-within{opacity:1;pointer-events:auto}
.touchy #ctl{opacity:.8;pointer-events:auto}
.touchy #ctl button{padding:12px 16px;font-size:18px}
#menu button[aria-current="true"]{background:rgba(255,197,61,.18);box-shadow:inset 3px 0 0 var(--sun)}
#ctl button{font:inherit;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:9px 12px;cursor:pointer;min-width:40px}
#ctl button:hover{background:rgba(255,255,255,.12)}
#ctl button[aria-pressed="true"]{background:#fff;color:var(--ink)}
#ctl button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#pos{color:#fff;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
#menu{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:51;display:none;min-width:min(420px,calc(100vw - 16px));max-width:calc(100vw - 16px);box-sizing:border-box;max-height:70vh;overflow:auto;padding:10px;border-radius:16px;background:rgba(15,27,51,.95);box-shadow:0 20px 60px rgba(0,0,0,.45)}
#menu.open{display:block}
@media (min-width:760px){#menu.open{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;min-width:min(760px,calc(100vw - 16px))}}
#menu button{display:block;width:100%;text-align:left;font:600 16px Inter;color:#fff;background:transparent;border:0;border-radius:10px;padding:12px 14px;cursor:pointer}
#menu button:hover,#menu button:focus-visible{background:rgba(255,255,255,.12);outline:none}
#menu button small{display:block;font:500 13px Inter;color:#AAB4CC;margin-top:2px}
.shot #ctl,.shot #menu{display:none!important}

.th{line-height:1.5}

/* tools.css · interactive widgets + global pen (rendered by tools.js). Style A: white cards, radius 24, palette from style.css :root */
.w-input,.w-write,.w-sort,.w-bars,.w-line,.w-pie,.w-picto,.w-dots{position:relative;display:flex;flex-direction:column;gap:14px;min-width:0;background:#fff;border-radius:24px;padding:22px 26px;box-shadow:0 14px 40px rgba(15,27,51,.09);font:500 26px/1.3 Inter,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:box-shadow .3s}
.card>.w-input,.card>.w-write,.card>.w-sort,.card>.w-bars,.card>.w-line,.card>.w-pie,.card>.w-picto,.card>.w-dots{background:transparent;box-shadow:none;padding:0;border-radius:0}

/* answer shown: a clear, deliberate state */
.w-shown{box-shadow:0 0 0 4px var(--mint),0 14px 40px rgba(15,27,51,.09)}
.card>.w-shown{box-shadow:none;outline:4px solid var(--mint);outline-offset:12px;border-radius:14px}
.w-shown::after{content:"Answer";position:absolute;top:-25px;right:26px;z-index:3;padding:7px 18px;border-radius:999px;background:var(--mint);color:#fff;font:800 24px/1.2 Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 18px rgba(31,191,159,.35);pointer-events:none}
/* no tab where it could cover content: inside a .card, and on the small typed-answer box (its mint input, "Answer shown" and Hide answer are enough) */
.card>.w-shown::after,.w-input.w-shown::after{display:none}
.w-input.w-shown{box-shadow:0 14px 40px rgba(15,27,51,.09)}
.card>.w-input.w-shown{box-shadow:none;outline:none}

/* shared parts */
.tw-ttl{flex:none;font:700 28px/36px Inter,system-ui,sans-serif;height:36px;white-space:nowrap}
.tw-lab{display:block;font:600 28px/1.25 Inter,system-ui,sans-serif}
.tw-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
.tw-head .tw-lab,.tw-head .tw-ttl{flex:1;min-width:0}
.tw-foot{flex:none;display:flex;align-items:center;gap:14px;height:52px}
.tw-btns{display:flex;gap:10px;flex:none}
.tw-btn{font:700 24px/1 Inter,system-ui,sans-serif;height:52px;padding:0 20px;border-radius:15px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;touch-action:manipulation;transition:background .15s,border-color .15s,transform .1s}
.tw-btn:hover{border-color:#AAB4CC;background:#F8F9FC}
.tw-btn:active{transform:translateY(2px)}
.tw-btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 18px rgba(59,108,255,.28)}
.tw-btn.pri:hover{background:#2F5CE6;border-color:#2F5CE6}
.tw-btn.show{min-width:192px}
.tw-btn.show[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#fff}
.tw-btn.show.nudge{border-color:var(--sun);background:var(--lsun)}
.tw-btn:disabled{opacity:.4;cursor:default;transform:none}
.tw-btn:focus-visible,.tw-in:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tw-btn.icon{width:52px;padding:0;display:grid;place-items:center}
.tw-btn.icon[aria-pressed="true"]{background:var(--lblue);border-color:var(--blue);color:var(--blue)}
.tw-btn.icon[aria-pressed="false"]{color:var(--mute)}
.tw-btn.round{width:var(--bh,52px);height:var(--bh,52px);padding:0;border-radius:50%;font-size:30px;font-weight:800;display:grid;place-items:center}
.tw-ico{width:26px;height:26px;flex:none;display:block}
.tw-fb{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:10px;min-height:40px;font:600 24px/1.2 Inter,system-ui,sans-serif;color:var(--mute);text-align:right}
.tw-fb.ok{color:var(--okc)}.tw-fb.no{color:var(--noc)}.tw-fb.info{color:var(--blue)}
.tw-fb .tw-ico{width:32px;height:32px;padding:5px;border-radius:50%;color:#fff;background:var(--mint)}
.tw-fb.no .tw-ico{background:var(--coral)}
.w-narrow .tw-foot{height:auto;flex-direction:column-reverse;align-items:stretch;gap:8px}
.w-narrow .tw-foot .tw-fb{justify-content:flex-start;text-align:left;flex:none;height:40px}
.tw-plot{position:relative;flex:1;min-height:0;min-width:0}
.tw-svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.tw-svg text{pointer-events:none}
.tw-mark{display:none;flex:none;width:34px;height:34px;border-radius:50%;place-items:center;color:#fff;background:var(--mint)}
.tw-mark .tw-ico{width:22px;height:22px}
.tw-mark.ok,.tw-mark.no,.item.ok>.tw-mark,.item.no>.tw-mark{display:grid}
.tw-mark.no,.item.no>.tw-mark{background:var(--coral)}

/* text inputs */
.tw-in{font:700 32px/1 Inter,system-ui,sans-serif;height:64px;padding:0 18px;border-radius:16px;border:2.5px solid var(--line);background:#F8F9FC;color:var(--ink);min-width:0;-webkit-user-select:text;user-select:text;font-variant-numeric:tabular-nums;transition:border-color .2s,background .2s}
.tw-in:focus{border-color:var(--blue);background:#fff;outline:none}
.tw-in.ok{border-color:var(--mint);background:var(--lmint)}
.tw-in.no{border-color:var(--coral);background:var(--lcoral)}
.tw-unit{font:600 28px Inter,system-ui,sans-serif;color:var(--mute)}
.tw-inrow{display:flex;align-items:center;gap:14px;min-height:64px}
.w-input .tw-foot .tw-fb{display:none}
.w-input.w-narrow .tw-foot .tw-fb{display:flex}

/* MCQ */
.ch[data-mcq] .c{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ch[data-mcq] .c:hover{box-shadow:0 14px 34px rgba(15,27,51,.14)}
.ch[data-mcq] .c:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.ch .c.wrong{border-color:var(--coral);background:var(--lcoral)}
.ch .c.wrong b{background:var(--coral);color:#fff}

/* handwriting */
.tw-pad{position:relative;flex:1;min-height:0;border-radius:16px;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh,64px) - 2.5px),#C9D4EC calc(var(--lh,64px) - 2.5px),#C9D4EC var(--lh,64px)) #FAFBFE;border:2px solid var(--line);touch-action:none;cursor:crosshair;overflow:hidden}
.tw-pad::before{content:"";position:absolute;left:58px;top:0;bottom:0;border-left:2.5px solid rgba(255,107,91,.4)}
.ink-c{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

/* sorting */
.tw-pool{flex:none;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;min-height:70px;padding:12px;border-radius:18px;background:#F4F6FB;border:2px dashed transparent}
.tw-binrow{flex:1;min-height:0;display:flex;gap:16px}
.w-sort .tw-pool:empty{display:none}
.w-sort .tw-foot{position:relative;z-index:6}
.tw-bin{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;background:var(--lblue);border:2.5px dashed #A9BCFF;cursor:default;transition:background .15s,border-color .15s}
.tw-bin.b1{background:var(--lviolet);border-color:#C3B4FF}.tw-bin.b2{background:var(--lsun);border-color:#F4D27A}.tw-bin.b3{background:var(--lmint);border-color:#8EDCCB}
.tw-bint{font:700 26px/1.2 Inter,system-ui,sans-serif;color:var(--blue);text-align:center}
.tw-bin.b1 .tw-bint{color:var(--violet)}.tw-bin.b2 .tw-bint{color:#A86F00}.tw-bin.b3 .tw-bint{color:var(--okc)}
.tw-slot{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.tw-slot.scroll{overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.w-sort.dragging .tw-slot.scroll{overflow:visible}
.w-sort.tight .tw-slot,.w-sort.tight .tw-pool{gap:7px}
.w-sort.tight .item{font-size:24px;line-height:1.15;padding:7px 12px;border-radius:13px;gap:7px}
.w-sort.tight .item>.tw-mark{width:26px;height:26px}
.w-sort.tight .tw-bin{padding:10px;gap:6px}
.w-sort.picking .tw-bin,.w-sort.picking .tw-pool{cursor:pointer}
.w-sort.picking .tw-bin{border-style:solid}
.tw-bin.over,.tw-pool.over{border-color:var(--blue);border-style:solid;box-shadow:inset 0 0 0 3px rgba(59,108,255,.25)}
.tw-bin:focus-visible,.w-sort .item:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.w-sort .item{position:relative;display:inline-flex;max-width:100%;align-items:center;gap:10px;padding:11px 18px;border-radius:16px;background:#fff;border:2.5px solid #E1E6F0;box-shadow:0 6px 16px rgba(15,27,51,.10);font:600 26px/1.25 Inter,system-ui,sans-serif;cursor:grab;touch-action:none;transition:border-color .15s,box-shadow .15s,background .15s}
.w-sort .item.sel{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,108,255,.22),0 10px 22px rgba(15,27,51,.14)}
.w-sort .item.drag{z-index:5;cursor:grabbing;pointer-events:none;box-shadow:0 22px 44px rgba(15,27,51,.28)}
.w-sort .item.ok{border-color:var(--mint);background:var(--lmint)}
.w-sort .item.no{border-color:var(--coral);background:var(--lcoral)}
.w-sort .item>.tw-mark{width:30px;height:30px}

/* charts */
.tw-minor{stroke-dasharray:4 7}
.chart .tw-ylab{fill:var(--mute)}
.tw-track{fill:#F3F5FA;stroke:transparent;stroke-width:3;transition:fill .15s}
.tw-col{outline:none;cursor:ns-resize}
.tw-col:hover .tw-track{fill:#EAEEF7}
.tw-col:focus-visible .tw-track{stroke:var(--sun)}
.tw-bar{transition:fill-opacity .2s}
.tw-knob circle{filter:drop-shadow(0 3px 6px rgba(15,27,51,.25))}
.tw-tag rect{fill:transparent}
.tw-tag use{display:none;color:#fff}
.tw-tag.ok rect{fill:var(--mint)}.tw-tag.no rect{fill:var(--coral)}
.tw-tag.ok text,.tw-tag.no text{fill:#fff}
.tw-tag.ok use,.tw-tag.no use{display:block}
.tw-col.no .tw-bar{fill-opacity:.4;stroke:var(--noc);stroke-width:4;stroke-dasharray:9 7}
.chart .lab.tw-bad{fill:var(--noc)}.chart .lab.tw-good{fill:var(--okc)}
.w-line .tw-track{fill:transparent}
.w-line .tw-col:hover .tw-track{fill:rgba(59,108,255,.06)}
.tw-guide{stroke:#E1E6F0;stroke-width:2;stroke-dasharray:3 7}
.tw-path{stroke:var(--blue)}
.tw-pt{fill:#fff;stroke:var(--blue);stroke-width:6;filter:drop-shadow(0 3px 6px rgba(15,27,51,.25))}
.tw-col.ok .tw-pt{fill:var(--mint);stroke:#fff}
.tw-col.no .tw-pt{fill:var(--coral);stroke:#fff}

/* dot plot */
.w-dots .tw-track{fill:transparent}
.w-dots .tw-col{cursor:pointer}
.w-dots .tw-col:hover .tw-track{fill:rgba(59,108,255,.06)}
.tw-dot{fill:var(--blue)}
.tw-col.ok .tw-dot{fill:var(--mint)}
.tw-col.no .tw-dot{fill:var(--coral)}
.tw-ghost{fill:#fff;stroke:#B9C4DC;stroke-width:2.5;stroke-dasharray:5 5}
.tw-ghostp{stroke:#8C97B2;stroke-width:2.5;stroke-linecap:round;fill:none}

/* pie */
.tw-piebody{flex:1;min-height:0;display:flex;gap:56px;align-items:center;justify-content:center}
.w-pie .tw-plot{flex:none}
.w-pie .tw-piesvg{position:static;display:block;cursor:default;touch-action:auto}
.tw-tbl{flex:none;border-collapse:separate;border-spacing:0;font:500 28px Inter,system-ui,sans-serif;border-radius:18px;overflow:hidden;box-shadow:0 0 0 2px #E6EAF3}
.tw-tbl th{background:var(--blue);color:#fff;font:700 24px Inter,system-ui,sans-serif;padding:13px 22px;text-align:left;white-space:nowrap}
.tw-tbl td{padding:var(--rp,8px) 22px;border-bottom:1.5px solid #E6EAF3;white-space:nowrap;vertical-align:middle}
.tw-tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tw-tbl tfoot td{font-weight:700;background:var(--lblue);border-bottom:0;padding:14px 22px}
.tw-tbl .tw-pn span{vertical-align:middle;font-weight:600}
.tw-sw{display:inline-block;width:24px;height:24px;border-radius:8px;margin-right:14px;vertical-align:middle}
.tw-tbl .tw-in{width:120px;height:56px;font-size:30px;text-align:right;padding:0 14px;vertical-align:middle}
.tw-tbl .tw-unit{display:inline-block;width:28px;text-align:left;margin-left:6px;font-size:28px;vertical-align:middle}
.tw-sum{color:var(--mute);min-width:200px}
.tw-sum b{color:var(--ink);font-weight:800}
.tw-sum.ok b{color:var(--okc)}.tw-sum.no b{color:var(--noc)}
.tw-empty{fill:#F1F3F9;stroke:#C9D2E3;stroke-width:2.5;stroke-dasharray:7 7}
.tw-ptick{stroke:#B9C4DC;stroke-width:2.5;stroke-linecap:round}
.tw-slice{stroke:#fff;stroke-width:3;stroke-linejoin:round}
.tw-slab{font:700 22px Inter,system-ui,sans-serif;fill:#fff}
.tw-slab.dark{fill:var(--ink)}
.tw-slab .tw-sval{font-weight:600}

/* pictogram */
.tw-key{flex:none;display:flex;align-items:center;gap:10px;padding:6px 18px 6px 12px;border-radius:999px;background:var(--lsun);font:700 26px Inter,system-ui,sans-serif;white-space:nowrap}
.tw-key .tw-ic,.tw-key .tw-ic svg{height:40px;width:calc(40px*var(--ir,1))}
.tw-prows{flex:1;min-height:0;display:grid;grid-template-columns:max-content 1fr max-content;grid-auto-rows:1fr;align-items:stretch}
.tw-pl,.tw-pa,.tw-pc{display:flex;align-items:center;border-bottom:2px dashed var(--line);min-width:0}
.tw-prows>.tw-pl{font:700 28px Inter,system-ui,sans-serif;padding-right:26px}
.tw-pa{gap:10px;padding-left:6px}
.tw-pc{gap:8px;padding-left:14px}
.tw-pc .tw-mark{display:grid;visibility:hidden;margin-left:6px}
.tw-pc .tw-mark.ok,.tw-pc .tw-mark.no{visibility:visible}
.tw-ic{display:block;flex:none;width:var(--iw);height:var(--ih)}
.tw-ic svg{display:block;width:var(--iw);height:var(--ih)}
.tw-ic.half{width:calc(var(--iw)/2);overflow:visible}
.tw-ic.half svg{clip-path:inset(0 50% 0 0)}

/* ---------- global pen ---------- */
#pen-layer{position:absolute;inset:0;z-index:40;pointer-events:none;touch-action:none}
.pen-on #pen-layer{pointer-events:auto;cursor:crosshair}
.pen-on #pen-layer.erase{cursor:cell}
#pen-bar{position:absolute;left:24px;top:50%;transform:translateY(-50%);z-index:41;display:none;flex-direction:column;align-items:center;gap:7px;padding:10px;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(15,27,51,.24),0 0 0 1.5px rgba(15,27,51,.06)}
.pen-on #pen-bar{display:flex}
#pen-bar .pb{width:58px;height:58px;border-radius:16px;border:2.5px solid transparent;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation}
#pen-bar .pb:hover{background:#F1F3F9}
#pen-bar .pb[aria-pressed="true"]{background:var(--lblue);border-color:var(--blue);color:var(--blue)}
#pen-bar .pb:disabled{opacity:.35;cursor:default}
#pen-bar .pb:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
#pen-bar .pb .tw-ico{width:30px;height:30px}
#pen-bar .pc{display:block;width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 4.5px rgba(15,27,51,.14)}
#pen-bar .ps{display:block;width:38px;height:2px;border-radius:2px;background:#E1E6F0;margin:2px 0}
.shot #pen-bar{display:none!important}

.locked #ctl,.locked #stage{visibility:hidden}
#lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(1200px 700px at 20% 10%,#E9EEFF,#F6F7FB 60%);font-family:Inter,system-ui,sans-serif;color:#0F1B33;padding:20px}
#lock .card{width:min(440px,100%);background:#fff;border-radius:24px;padding:36px 34px 30px;box-shadow:0 24px 60px rgba(15,27,51,.12)}
#lock .kick{font:700 13px Inter;letter-spacing:.14em;text-transform:uppercase;color:#3B6CFF}
#lock h1{font:800 34px/1.1 Display,Inter,sans-serif;margin:10px 0 8px;letter-spacing:-.02em}
#lock p{margin:0 0 22px;font:500 16px/1.5 Inter;color:#4A5675}
#lock label{display:block;font:600 14px Inter;margin-bottom:8px}
#lock .row{display:flex;gap:10px}
#lock input{flex:1;min-width:0;font:500 18px Inter;padding:13px 14px;border:2px solid #D5DCEC;border-radius:14px;outline:none}
#lock input:focus{border-color:#3B6CFF}
#lock .row{align-items:stretch}
#lock button{font:700 17px Inter;color:#fff;background:#3B6CFF;border:0;border-radius:14px;padding:0 24px;cursor:pointer;height:auto;min-height:52px;line-height:1}
#lock button:disabled{opacity:.6}
#lock #lock-msg{min-height:22px;margin-top:12px;font:600 15px Inter;color:#4A5675}
#lock #lock-msg.bad{color:#B8321F}

<script>/* Password lock for a deck built with `build.py --lock` (the teacher-only answer keys).
   The slides are encrypted at build time with AES-256-GCM; the key comes from the password via PBKDF2-SHA256.
   The published page holds only ciphertext, so without the password the answers cannot be read, not even in the
   page source. A link ending in #k=<password> opens the deck directly; the key is removed from the address bar at
   once, and a URL fragment is never sent to the web server.
   After a successful unlock the slides are put into #stage and boot() starts the deck engine and the tools. */
(function () {
  var data = document.getElementById('lockdata');
  if (!data) { boot(); return; }
  var d = JSON.parse(data.textContent), box = document.getElementById('lock');
  var input = document.getElementById('lock-pw'), btn = document.getElementById('lock-go'), msg = document.getElementById('lock-msg');
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function unlock(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(d.s), iterations: d.n, hash: 'SHA-256' }, base,
          { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(d.i) }, key, bytes(d.c)); })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function open(html) {
    document.getElementById('stage').innerHTML = html;   /* authenticated by AES-GCM: only our own build can produce it */
    data.remove(); box.remove(); document.documentElement.classList.remove('locked');
    boot();
  }
  function attempt(pw) {
    if (!pw) return;
    btn.disabled = true; msg.textContent = 'Opening…'; msg.className = '';
    unlock(pw).then(open, function () {
      btn.disabled = false; msg.textContent = 'That password is not right. Try again.'; msg.className = 'bad';
      input.select();
    });
  }
  btn.addEventListener('click', function () { attempt(input.value); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(input.value); });
  var m = /^#k=([^&]+)/.exec(location.hash);
  if (m) {
    var pw = decodeURIComponent(m[1]);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    attempt(pw);
  } else input.focus();
})();

function boot() {
/* Deck engine: stage scaling, beats, navigation, lesson menu, control bar.
   Slides: <section class="slide" data-steps="N" data-lesson="1" data-title="...">. Beats add .b1..b4 to the slide.
   Only arrow keys, PageUp/PageDown and the ‹ › buttons change the slide; clicks, taps and swipes never do.
   Events: document dispatches 'deck:change' {detail:{i,st,slide}} after every change; listens for 'deck:pen' (tools toggle).
   Test hooks: window.__deck = {next, prev, jump(i, beat), state()}; ?still = no motion (screenshots). */
(function () {
  var root = document.documentElement, stage = document.getElementById('stage');
  var slides = [].slice.call(stage.querySelectorAll('.slide')), N = slides.length, i = 0, st = 0;
  var STEPS = slides.map(function (s) { return +s.dataset.steps || 0; });
  var qs = new URLSearchParams(location.search);
  if (qs.has('still')) root.classList.add('rm', 'shot');
  else if (matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('rm');

  /* Size from the visible area (clientWidth/Height), not innerWidth: on phones and tablets innerWidth can report a
     larger layout viewport, which made the slide zoom in and get cut off. */
  function vw() { return root.clientWidth || innerWidth; }
  function vh() { return root.clientHeight || innerHeight; }
  function fit() {
    var s = Math.min(vw() / 1920, vh() / 1080);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
    root.style.setProperty('--scale', s);
  }
  addEventListener('resize', fit); addEventListener('orientationchange', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit();

  function count(el) {
    var to = +el.dataset.count, dec = (el.dataset.count.split('.')[1] || '').length, t0 = null, tok = el._tok = {};
    if (root.classList.contains('rm')) { el.textContent = to.toFixed(dec); return; }
    function f(t) { if (el._tok !== tok) return; if (!t0) t0 = t; var p = Math.min(1, (t - t0) / 900); el.textContent = (to * (1 - Math.pow(1 - p, 3))).toFixed(dec); if (p < 1) requestAnimationFrame(f); }
    el.textContent = (0).toFixed(dec); requestAnimationFrame(f);
  }

  var pos = document.getElementById('pos'), live = document.getElementById('live');
  function lessonOf(k) { for (var j = k; j >= 0; j--) if (slides[j].dataset.lesson) return slides[j]; return null; }
  function show(dir) {
    slides.forEach(function (s, k) {
      var on = k === i;
      s.classList.toggle('on', on);
      for (var b = 1; b <= 4; b++) s.classList.toggle('b' + b, on && st >= b);
      if (on) { s.removeAttribute('inert'); s.setAttribute('aria-hidden', 'false'); }
      else { s.setAttribute('inert', ''); s.setAttribute('aria-hidden', 'true'); }
    });
    var s = slides[i];
    s.querySelectorAll('[data-count]').forEach(function (el) {
      var at = +(el.dataset.at || 0);
      if (st === at || (dir === 'jump' && st >= at)) count(el);
      else if (st < at) { el._tok = null; el.textContent = ''; }
    });
    var L = lessonOf(i);
    if (menuEl) [].forEach.call(menuEl.children, function (b) { b.setAttribute('aria-current', b._slide === L ? 'true' : 'false'); });
    if (pos) pos.textContent = (i + 1) + ' / ' + N + (STEPS[i] ? '  ·  step ' + st + ' of ' + STEPS[i] : '');
    if (live) live.textContent = (L ? L.dataset.title + '. ' : '') + 'Slide ' + (i + 1) + ' of ' + N + (STEPS[i] ? ', step ' + st + ' of ' + STEPS[i] : '');
    if (!qs.has('still')) try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
    document.dispatchEvent(new CustomEvent('deck:change', { detail: { i: i, st: st, slide: s } }));
  }
  function next() { if (st < STEPS[i]) st++; else if (i < N - 1) { i++; st = 0; } else return; show('fwd'); }
  function prev() { if (st > 0) st--; else if (i > 0) { i--; st = STEPS[i]; } else return; show('back'); }
  function jump(k, b) { i = Math.max(0, Math.min(N - 1, k | 0)); st = Math.max(0, Math.min(b | 0, STEPS[i])); show('jump'); }

  function busy(t) { return root.classList.contains('pen-on') || (t && t.closest && t.closest('.ia,a,button,input,textarea,select,label,#ctl,#menu,[contenteditable]')); }
  /* The slide changes ONLY with the arrow keys (or a clicker's PageUp/PageDown) and the ‹ › buttons (owner, 27 Nov).
     Clicking, tapping or swiping on the slide never changes it, so a wrong click at the board cannot skip ahead. */
  if (matchMedia('(pointer: coarse)').matches) root.classList.add('touchy');   /* touch screens: the bar is visible from the start */
  addEventListener('pointerdown', function (e) { if ((e.pointerType || 'mouse') !== 'mouse') root.classList.add('touchy'); }, true);
  stage.addEventListener('click', function () { if (menuOpen()) closeMenu(); });
  addEventListener('keydown', function (e) {
    var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    var k = e.key, nav = k === 'PageDown' || k === 'PageUp' || ((k === 'ArrowRight' || k === 'ArrowLeft') && !typing);
    if (menuOpen()) {   /* while the lesson menu is open, keys move inside it and never change the slide */
      var items = [].slice.call(menuEl.children), at = items.indexOf(document.activeElement);
      if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); e.stopPropagation(); items[Math.min(items.length - 1, at + 1)].focus(); }
      else if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); e.stopPropagation(); items[Math.max(0, at - 1)].focus(); }
      else if (k === 'Escape' || k === 'm' || k === 'M') { e.preventDefault(); e.stopPropagation(); closeMenu(); }
      else if (!(t && t.closest && t.closest('#menu'))) { e.preventDefault(); e.stopPropagation(); }
      return;
    }
    if (!nav) return;
    e.preventDefault(); e.stopPropagation();
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    (k === 'PageDown' || k === 'ArrowRight') ? next() : prev();
  }, true);
  addEventListener('keydown', function (e) {
    var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    var k = e.key;
    if ((k === ' ' || k === 'Enter') && t && t.closest && t.closest('button,.ia,a')) return;
    if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'Home') jump(0); else if (k === 'End') jump(N - 1, 9);
    else if (k === 'f' || k === 'F') fs();
    else if (k === 'p' || k === 'P') document.dispatchEvent(new CustomEvent('deck:pen'));
    else if (k === 'm' || k === 'M') menu();
    else if (k === 'Escape') closeMenu();
  });
  /* control bar: shows on pointer move, hides after 2.5 s */
  var ctl = document.getElementById('ctl'), hideT = null;
  function wake() { if (!ctl) return; ctl.classList.add('show'); clearTimeout(hideT); hideT = setTimeout(function () { ctl.classList.remove('show'); }, 2500); }
  addEventListener('pointermove', wake); addEventListener('touchstart', wake, { passive: true });
  function fs() { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); }
  var menuEl = document.getElementById('menu');
  function menuOpen() { return !!(menuEl && menuEl.classList.contains('open')); }
  function closeMenu() {
    if (!menuOpen()) return;
    menuEl.classList.remove('open'); var mb = document.getElementById('mn'); if (mb) mb.setAttribute('aria-expanded', 'false');
    if (menuEl.contains(document.activeElement)) document.activeElement.blur();
  }
  function menu() {
    if (!menuEl) return; if (menuOpen()) { closeMenu(); return; }
    menuEl.classList.add('open'); var mb = document.getElementById('mn'); if (mb) mb.setAttribute('aria-expanded', 'true');
    var cur = menuEl.querySelector('[aria-current="true"]') || menuEl.firstChild; if (cur) cur.focus();
  }
  if (menuEl) {
    slides.forEach(function (s, k) {
      if (!s.dataset.lesson) return;
      var b = document.createElement('button'); b.type = 'button';
      b.textContent = s.dataset.title; var sm = document.createElement('small'); sm.textContent = 'Slide ' + (k + 1); b.appendChild(sm); b._slide = s;
      b.addEventListener('click', function () { closeMenu(); jump(k); });
      menuEl.appendChild(b);
    });
  }
  function on(id, f) { var el = document.getElementById(id); if (el) el.addEventListener('click', function (e) { e.stopPropagation(); f(); }); }
  on('pv', prev); on('nx', next); on('mn', menu); on('fs', fs);
  on('pen', function () { document.dispatchEvent(new CustomEvent('deck:pen')); });
  document.addEventListener('pen:state', function (e) { var b = document.getElementById('pen'); if (b) b.setAttribute('aria-pressed', e.detail.on ? 'true' : 'false'); });

  addEventListener('hashchange', function () { var n = parseInt((location.hash || '').slice(1), 10); if (n && n - 1 !== i) jump(n - 1); });
  window.__deck = { next: next, prev: prev, jump: jump, state: function () { return { i: i, st: st, steps: STEPS[i], n: N, id: slides[i].id }; } };
  var h = parseInt((location.hash || '').slice(1), 10);
  jump(h ? h - 1 : (qs.has('s') ? +qs.get('s') : 0), h ? 0 : +(qs.get('b') || 0));
})();

/* Interactive tools for the Unit 4 deck (vanilla JS, no libraries, no network).
   Renders every widget in CONTRACT.md + a global pen. Markup in, working tool out.
   Widgets: .ch[data-mcq] .w-input .w-write .w-sort .w-bars .w-line .w-pie .w-picto .w-dots
   Optional extras: data-start (bars, line, picto, dots), data-snap (bars, line), data-head="Item,Number" (pie).
   Pen: toggled by the 'deck:pen' document event; adds .pen-on to <html>; dispatches 'pen:state' {detail:{on}}.
   URL: ?still = default state, no motion · ?still&answers = Show answer on every widget (for checking).
   Test hooks: every widget root has .__w (state + helpers); window.__tools = {widgets, showAll, resetAll, pen}. */
(function () {
  'use strict';
  var root = document.documentElement, stage = document.getElementById('stage');
  if (!stage) return;
  var NS = 'http://www.w3.org/2000/svg';
  var qs = new URLSearchParams(location.search);
  var ANSWERS = qs.has('answers');
  var INK = '#0F1B33', BLUE = '#3B6CFF', VIOLET = '#7C5CFF', CORAL = '#FF6B5B', MINT = '#1FBF9F', SUN = '#FFC53D';
  var PAL = [BLUE, VIOLET, CORAL, MINT, SUN, '#5B6785', '#E0569B', '#0EA5C6'];   /* 8 distinct colours: pies with 7–8 slices never repeat a colour */
  var uid = 0, widgets = [];

  /* ---------- helpers ---------- */
  function still() { return root.classList.contains('rm'); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function sv(tag, at, parent) { var e = document.createElementNS(NS, tag); for (var k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; }
  function ico(name, cls) { var s = sv('svg', { 'class': cls || 'tw-ico', viewBox: '0 0 24 24', 'aria-hidden': 'true' }); sv('use', { href: '#' + name }, s); return s; }
  function num(v, d) { var n = parseFloat(v); return isFinite(n) ? n : d; }
  function list(s) { return s == null || String(s).trim() === '' ? [] : String(s).split(',').map(function (x) { return x.trim(); }); }
  function fmt(v) { return String(Math.round(v * 100) / 100); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function near(a, b) { return Math.abs(a - b) < 1e-6; }
  function btn(label, cls, act, fn) {
    var b = el('button', 'tw-btn' + (cls ? ' ' + cls : ''), label); b.type = 'button'; if (act) b.dataset.act = act;
    b.addEventListener('click', function (e) { e.stopPropagation(); fn(e); });
    return b;
  }
  function anim(node, frames, opt) { if (still() || !node.animate) return null; try { return node.animate(frames, opt); } catch (e) { return null; } }
  /* runs step(0..1) with ease-out; always ends with step(1), even without animation frames */
  function tween(dur, step, done) {
    var fin = false, t0 = null;
    function end() { if (fin) return; fin = true; step(1); if (done) done(); }
    if (still()) { end(); return { cancel: function () {} }; }
    function f(t) { if (fin) return; if (t0 === null) t0 = t; var p = (t - t0) / dur; if (p >= 1) return end(); step(1 - Math.pow(1 - p, 3)); requestAnimationFrame(f); }
    requestAnimationFrame(f); setTimeout(end, dur + 120);
    return { cancel: function () { fin = true; } };
  }
  /* pointer position inside a node, in the node's own (unscaled) pixels: the stage is scaled by a CSS transform */
  function local(node, e, W, H) {
    var r = node.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (r.width ? W / r.width : 1), y: (e.clientY - r.top) * (r.height ? H / r.height : 1) };
  }

    var y0 = H - (12 + fit.lines * fit.size * 1.15 + 8), y1 = 40, capN = Math.floor((y0 - y1) / 13);
    function cx(i) { return x0 + cw * (i + 0.5); }
    var cols = [], layers = [];
    for (var i = 0; i < n; i++) (function (i) {
      var c = sv('g', { 'class': 'tw-col', tabindex: 0, role: 'spinbutton', 'aria-label': labels[i], 'aria-valuemin': 0, 'data-i': i }, svg);
      sv('rect', { x: cx(i) - Math.min(cw - 6, 110) / 2, y: y1 - 30, width: Math.min(cw - 6, 110), height: y0 - y1 + 26, rx: 14, 'class': 'tw-track' }, c);
      layers.push(sv('g', {}, c)); cols.push(c);
      c.addEventListener('keydown', function (e) {
        if (['ArrowUp', '+', '=', 'Enter', ' ', 'ArrowDown', '-', 'Delete'].indexOf(e.key) >= 0) ac.hide();

    })(i);
    sv('line', { x1: x0 - 6, y1: y0, x2: x1 + 6, y2: y0, 'class': 'axis' }, svg);
    for (i = 0; i < n; i++) sv('line', { x1: cx(i), y1: y0, x2: cx(i), y2: y0 + 8, 'class': 'axis' }, svg);
    var labs = drawLabels(svg, fit, cx, y0 + 10), dia = 40;
    function draw() {
      var most = Math.max.apply(null, vals.concat(ans || [], [0]));
      dia = Math.min(cw * 0.62, 52, (y0 - y1) / Math.max(6, most + 1));
      for (var k = 0; k < n; k++) {
        var g = layers[k], v = vals[k], r = dia / 2 - Math.max(1.5, dia * 0.06);
        g.textContent = '';
        for (var j = 0; j < v; j++) sv('circle', { cx: cx(k), cy: y0 - dia * (j + 0.5), r: r, 'class': 'tw-dot' }, g);
        if (v < capN) {
          var gy = y0 - dia * (v + 0.5), a = Math.min(7, r * 0.45);

          sv('path', { d: 'M' + (cx(k) - a) + ' ' + gy + 'h' + 2 * a + 'M' + cx(k) + ' ' + (gy - a) + 'v' + 2 * a, 'class': 'tw-ghostp' }, g);
        }

    }
    function set(i, v) {
      ac.hide(); v = clamp(v, 0, capN); if (v === vals[i]) return;
      vals[i] = v; state = []; draw();

      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var p = local(box, e, W, H); if (p.x < x0 || p.x > x1) return;
      var k = clamp(Math.floor((p.x - x0) / cw), 0, n - 1);
      if (e.cancelable) e.preventDefault();

      if (vals[k] > 0 && p.y >= y0 - vals[k] * dia && p.y <= y0) set(k, vals[k] - 1); else set(k, vals[k] + 1);
    });
    function check() {
      ac.hide(); var bad = 0;
      vals.forEach(function (v, k) { var ok = v === ans[k]; state[k] = ok ? 'ok' : 'no'; if (!ok) bad++; });
      draw();
      ft.say(bad ? 'no' : 'ok', bad ? (bad === 1 ? '1 stack is not right yet' : bad + ' stacks are not right yet') : 'Correct! Well done');
    }
    function reset() { ac.off(); vals = start.slice(); state = []; draw(); if (ans) ft.say(''); }
    var ac = answerCtl(w, ft, {
      snap: function () { return vals.slice(); },
      reveal: function () { vals = ans.slice(); state = ans.map(function () { return 'ok'; }); draw(); },

    draw();
    return register(w, { type: 'dots', show: ans ? ac.show : null, hide: ac.hide, reset: reset, check: ans ? check : null, cols: cols,
      values: function () { return vals.slice(); },
      at: function (k, j) { return toClient(box, cx(k), y0 - dia * (j + 0.5), W, H); } });
  }

  /* ================= global pen ================= */
  function pen() {
    var layer = el('div'); layer.id = 'pen-layer'; stage.appendChild(layer);
    var ink = Ink(layer, 1920, 1080, 1.5); ink.enabled = false;
    var bar = el('div'); bar.id = 'pen-bar'; bar.setAttribute('role', 'toolbar'); bar.setAttribute('aria-label', 'Pen tools'); bar.setAttribute('aria-orientation', 'vertical');
    stage.appendChild(bar);
    var store = {}, cur = window.__deck ? window.__deck.state().i : 0, on = false, size = 'thin', tool = 'pen';
    ink.st = store[cur] = { strokes: [], hist: [] };
    var groups = { color: [], size: [], tool: [] };
    function tb(label, inner, group, val, fn) {
      var b = el('button', 'pb'); b.type = 'button'; b.setAttribute('aria-label', label); b.title = label; b.dataset.pen = val;
      if (typeof inner === 'string') b.appendChild(rawIcon(inner)); else b.appendChild(inner);

      b.addEventListener('click', function (e) { e.stopPropagation(); fn(); sync(); });

    }
    function sep() { bar.appendChild(el('i', 'ps')); }
    var colors = [['Ink', INK], ['Blue', BLUE], ['Coral', CORAL], ['Mint', MINT], ['Yellow', SUN]];
    var penColor = INK, hiColor = SUN;   /* the highlighter has its own colour: sun yellow by default */
    colors.forEach(function (c) {
      var sw = el('i', 'pc'); sw.style.background = c[1];
      tb(c[0], sw, 'color', c[1], function () { if (tool === 'erase') tool = 'pen'; if (tool === 'hi') hiColor = c[1]; else penColor = c[1]; });
    });
    sep();
    tb('Thin', '<path d="M4 16 Q9 6 13 12 T20 9" stroke-width="2"/>', 'size', 'thin', function () { size = 'thin'; });
    tb('Thick', '<path d="M4 16 Q9 6 13 12 T20 9" stroke-width="5"/>', 'size', 'thick', function () { size = 'thick'; });
    sep();
    var u = sv('svg', { 'class': 'tw-ico', viewBox: '0 0 24 24', 'aria-hidden': 'true' }); sv('use', { href: '#pencil' }, u);
    tb('Pen', u, 'tool', 'pen', function () { tool = 'pen'; });
    tb('Highlighter', '<path d="M14 4l6 6-8 8H6v-6z"/><path d="M4 21h9" stroke-width="3"/>', 'tool', 'hi', function () { tool = 'hi'; });
    tb('Eraser', '<path d="M8 20l-4.5-4.5a1.5 1.5 0 0 1 0-2.1L13 4l7 7-9 9z"/><path d="M8 20h12M9 8l7 7"/>', 'tool', 'erase', function () { tool = 'erase'; });
    var bAuto = tb('Auto shapes', SHAPES_ICON, null, 'auto', function () { ink.auto = !ink.auto; });
    sep();
    var bUndo = tb('Undo', '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>', null, 'undo', function () { ink.undo(); });
    var bClear = tb('Clear this slide', '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/>', null, 'clear', function () { ink.clear(); });
    sep();
    var x = sv('svg', { 'class': 'tw-ico', viewBox: '0 0 24 24', 'aria-hidden': 'true' }); sv('use', { href: '#cross' }, x);
    tb('Close pen', x, null, 'close', function () { set(false); });
    function sync() {
      ink.mode = tool === 'erase' ? 'erase' : 'draw';
      ink.color = tool === 'hi' ? hiColor : penColor;
      ink.alpha = tool === 'hi' ? (hiColor === SUN ? 0.5 : 0.32) : 1;
      ink.size = tool === 'hi' ? (size === 'thin' ? 22 : 36) : (size === 'thin' ? 5 : 11);
      groups.color.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.pen === ink.color && tool !== 'erase' ? 'true' : 'false'); });
      groups.size.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.pen === size ? 'true' : 'false'); });
      groups.tool.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.pen === tool ? 'true' : 'false'); });
      bAuto.setAttribute('aria-pressed', ink.auto ? 'true' : 'false');

    function set(v) {

  }

  /* ================= tap guard =================
     After a quick finger drag (a flick), Chrome can swallow the click of the next tap ("tap stops the fling").

  (function () {
    var down = null, lastClick = -1, synthAt = -1e9, synthT = null;

      }, 90);
    }, true);
  })();

  /* ================= start ================= */
  var kinds = [['.ch[data-mcq]', mcq], ['.w-input', input], ['.w-write', write], ['.w-sort', sort], ['.w-bars', bars], ['.w-line', line], ['.w-pie', pie], ['.w-picto', picto], ['.w-dots', dots]];
